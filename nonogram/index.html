<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nonogram</title>
<style>
  body {
    margin: 0; padding: 1rem;
    background: #0f172a; color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
    user-select: none; -webkit-user-select: none;
  }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 0.75rem; color: #94a3b8; }
  .toolbar { display: flex; gap: 0.4rem; margin-bottom: 1rem; flex-wrap: wrap; justify-content: center; align-items: center; }
  .toolbar button, .paste-bar button {
    background: #1e293b; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 6px;
    padding: 0.35rem 0.7rem; font-size: 0.8rem;
    cursor: pointer; font-family: inherit;
  }
  .toolbar button.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; font-weight: 600; }
  .toolbar button:hover:not(.active), .paste-bar button:hover { background: #334155; }
  canvas { display: block; border-radius: 8px; touch-action: none; }
  #status { margin-top: 1rem; font-size: 0.9rem; min-height: 1.5em; color: #4ade80; text-align: center; max-width: 600px; padding: 0.4rem 0.8rem; border-radius: 6px; }
  #status.error { color: #fecaca; background: #7f1d1d; }
  .color-picker { display: flex; gap: 0.25rem; align-items: center; }
  .color-swatch { width: 24px; height: 24px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; box-sizing: border-box; }
  .color-swatch.active { border-color: #fff; box-shadow: 0 0 0 2px #38bdf8; }

  .paste-bar { display: flex; gap: 0.4rem; margin-bottom: 0.5rem; justify-content: center; flex-wrap: wrap; }
  .paste-panel { background: #1e293b; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.75rem; max-width: 600px; width: 100%; }
  .paste-panel.hidden { display: none; }
  #paste-input {
    width: 100%; min-height: 140px;
    background: #0f172a; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 6px;
    padding: 0.6rem; font-family: ui-monospace, monospace;
    font-size: 0.8rem; resize: vertical; box-sizing: border-box;
  }
  #paste-input:focus { outline: 2px solid #38bdf8; border-color: transparent; }
  .paste-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
  .paste-actions button {
    flex: 1; padding: 0.5rem; border-radius: 6px;
    border: 1px solid #334155; font-family: inherit;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
    background: #38bdf8; color: #0f172a;
  }
  .paste-actions button.secondary { background: #334155; color: #e2e8f0; font-weight: 400; }
  .paste-actions button:hover { filter: brightness(1.1); }
  .paste-error { color: #f87171; font-size: 0.85rem; margin-top: 0.5rem; min-height: 1em; }

  .copy-fallback {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; padding: 1rem;
  }
  .copy-fallback .box {
    background: #1e293b; border-radius: 8px;
    padding: 1rem; width: 100%; max-width: 500px;
  }
  .copy-fallback textarea {
    width: 100%; height: 200px;
    background: #0f172a; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 6px;
    padding: 0.6rem; font-family: ui-monospace, monospace;
    font-size: 0.8rem; box-sizing: border-box;
  }
  .copy-fallback .hint {
    font-size: 0.85rem; color: #94a3b8;
    margin-bottom: 0.5rem; text-align: center;
  }
  .copy-fallback button {
    margin-top: 0.5rem; width: 100%;
    padding: 0.5rem; border-radius: 6px;
    border: 1px solid #334155; font-family: inherit;
    font-size: 0.9rem; cursor: pointer;
    background: #334155; color: #e2e8f0;
  }
</style>
</head>
<body>
<h1 id="puzzle-title">Nonogram</h1>

<div class="paste-bar">
  <button id="toggle-paste">📋 Paste a puzzle</button>
  <button id="copy-puzzle" style="display:none;">⧉ Copy current puzzle</button>
</div>
<div id="paste-panel" class="paste-panel hidden">
  <textarea id="paste-input" placeholder="Paste a nonogram here...

kafushy, Heart, 2026-10-26, v1
#0f172a #1e293b 180 / #38bdf8 90
/1 1.5.5.3.1/2.4.4.4.2"></textarea>
  <div class="paste-actions">
    <button id="load-puzzle">Load</button>
    <button id="cancel-paste" class="secondary">Cancel</button>
  </div>
  <div id="paste-error" class="paste-error"></div>
</div>

<div class="toolbar">
  <button id="tool-fill" class="active">Fill</button>
  <button id="tool-mark">Mark ×</button>
  <button id="tool-erase">Erase</button>
  <span id="color-picker" class="color-picker" style="display:none;"></span>
  <button id="reset">Reset</button>
</div>
<div id="game-wrap"></div>
<div id="status"></div>

<script src="./format.js"></script>
<script>
const DEFAULT_PUZZLE_TEXT = `
kafushy, Heart, 2026-10-26, v1
#0f172a #1e293b 180 / #38bdf8 90
/1 1.5.5.3.1/2.4.4.4.2
`;

let currentGame = null;
let currentPuzzleText = DEFAULT_PUZZLE_TEXT;

// =============== NonogramGame ===============
class NonogramGame {
  constructor(puzzle, canvas, titleEl, statusEl) {
    this.puzzle = puzzle;
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.titleEl = titleEl;
    this.statusEl = statusEl;

    if (puzzle.sections.length !== 2)
      throw new Error("Only 2-section (rectangular) puzzles supported for now");
    this.rows = puzzle.sections[0];
    this.cols = puzzle.sections[1];
    this.N = this.rows.length;
    this.M = this.cols.length;

    this.maxRowClues = Math.max(...this.rows.map(r => r.clues.length));
    this.maxColClues = Math.max(...this.cols.map(c => c.clues.length));

    this.state = Array.from({ length: this.N }, () => new Array(this.M).fill(0));
    this.marks = Array.from({ length: this.N }, () => new Array(this.M).fill(false));
    this.currentColor = 1;
    this.tool = "fill";
    this.won = false;
    this.painting = false;
    this.paintValue = null;
    this._checkingWin = false;

    this.titleEl.textContent = puzzle.title || "Nonogram";
    this.setupColorPicker();
    this.setupTools();
    this.resize();
    this.render();

    // Only re-resize if WIDTH changed (fixes mobile scroll resize)
    this._lastWidth = window.innerWidth;
    this._onResize = () => {
      if (window.innerWidth === this._lastWidth) return;
      this._lastWidth = window.innerWidth;
      this.resize();
      this.render();
    };
    window.addEventListener("resize", this._onResize);
  }

  destroy() {
    window.removeEventListener("resize", this._onResize);
  }

  setupColorPicker() {
    const picker = document.getElementById("color-picker");
    picker.innerHTML = "";
    if (!this.puzzle.multiColor) { picker.style.display = "none"; return; }
    picker.style.display = "flex";
    this.puzzle.fg.palette.forEach((hex, i) => {
      const sw = document.createElement("div");
      sw.className = "color-swatch" + (i === 0 ? " active" : "");
      sw.style.background = hex;
      sw.onclick = () => {
        this.currentColor = i + 1;
        picker.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("active"));
        sw.classList.add("active");
      };
      picker.appendChild(sw);
    });
  }

  setupTools() {
    const setTool = t => {
      this.tool = t;
      ["fill","mark","erase"].forEach(k =>
        document.getElementById("tool-" + k).classList.toggle("active", k === t));
    };
    document.getElementById("tool-fill").onclick = () => setTool("fill");
    document.getElementById("tool-mark").onclick = () => setTool("mark");
    document.getElementById("tool-erase").onclick = () => setTool("erase");
    document.getElementById("reset").onclick = () => this.reset();
  }

  reset() {
    this.state = Array.from({ length: this.N }, () => new Array(this.M).fill(0));
    this.marks = Array.from({ length: this.N }, () => new Array(this.M).fill(false));
    this.won = false;
    this.setStatus("");
    this.render();
  }

  setStatus(text, isError) {
    this.statusEl.textContent = text;
    this.statusEl.classList.toggle("error", !!isError);
  }

  resize() {
    const maxW = Math.min(window.innerWidth - 32, 900);
    const maxH = Math.min(window.innerHeight - 260, 900);
    const clueFactor = 0.7;
    const totalWCells = this.M + this.maxRowClues * clueFactor;
    const totalHCells = this.N + this.maxColClues * clueFactor;
    let cs = Math.floor(Math.min(maxW / totalWCells, maxH / totalHCells));
    cs = Math.max(16, Math.min(56, cs));
    this.cellSize = cs;
    this.marginLeft = Math.ceil(this.maxRowClues * cs * clueFactor) + 8;
    this.marginTop = Math.ceil(this.maxColClues * cs * clueFactor) + 8;
    const logicalW = this.marginLeft + this.M * cs + 6;
    const logicalH = this.marginTop + this.N * cs + 6;
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = logicalW * dpr;
    this.canvas.height = logicalH * dpr;
    this.canvas.style.width = logicalW + "px";
    this.canvas.style.height = logicalH + "px";
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.logicalW = logicalW;
    this.logicalH = logicalH;
  }

  cellToPixel(r, c) {
    return { x: this.marginLeft + c * this.cellSize, y: this.marginTop + r * this.cellSize };
  }
  pixelToCell(x, y) {
    const c = Math.floor((x - this.marginLeft) / this.cellSize);
    const r = Math.floor((y - this.marginTop) / this.cellSize);
    if (c < 0 || c >= this.M || r < 0 || r >= this.N) return null;
    return { r, c };
  }

  render() {
    this.ctx.clearRect(0, 0, this.logicalW, this.logicalH);
    this.drawBackground();
    this.drawCells();
    this.drawGridLines();
    this.drawClues();
    this.updateStatus();
  }

  // Gradient direction: 0 = right, 90 = up (screen coords)
  // gradient goes from center - dir*len/2 to center + dir*len/2
  makeGradient(palette, weights, angle, x, y, w, h) {
    const rad = angle * Math.PI / 180;
    const dx = Math.cos(rad);
    const dy = -Math.sin(rad);
    const len = Math.abs(w * dx) + Math.abs(h * dy);
    const cx = x + w / 2, cy = y + h / 2;
    const grad = this.ctx.createLinearGradient(
      cx - dx*len/2, cy - dy*len/2,
      cx + dx*len/2, cy + dy*len/2
    );
    const n = palette.length;
    if (n === 1) {
      grad.addColorStop(0, palette[0]);
      grad.addColorStop(1, palette[0]);
      return grad;
    }
    const positions = [0];
    let cum = 0;
    for (let i = 0; i < n; i++) { cum += weights[i]; positions.push(cum); }
    for (let i = 0; i < n; i++) {
      const mid = (positions[i] + positions[i+1]) / 2;
      grad.addColorStop(mid, palette[i]);
    }
    grad.addColorStop(0, palette[0]);
    grad.addColorStop(1, palette[n-1]);
    return grad;
  }

  drawBackground() {
    // Gradient is constrained to the grid rect only — clue areas stay transparent
    const gx = this.marginLeft, gy = this.marginTop;
    const gw = this.M * this.cellSize, gh = this.N * this.cellSize;
    const { palette, weights, angle } = this.puzzle.bg;
    this.ctx.fillStyle = this.makeGradient(palette, weights, angle, gx, gy, gw, gh);
    this.ctx.fillRect(gx, gy, gw, gh);
  }

  drawCells() {
    const ctx = this.ctx, cs = this.cellSize;
    const fg = this.puzzle.fg;
    const gx = this.marginLeft, gy = this.marginTop;
    const gw = this.M * cs, gh = this.N * cs;

    // In "visual gradient" mode (multiple fg colors but no commas),
    // cells are filled with a slice of the gradient, not a flat color.
    let gradientFill = null;
    if (!this.puzzle.multiColor && fg.palette.length > 1) {
      gradientFill = this.makeGradient(fg.palette, fg.weights, fg.angle, gx, gy, gw, gh);
    }

    for (let r = 0; r < this.N; r++) for (let c = 0; c < this.M; c++) {
      const { x, y } = this.cellToPixel(r, c);
      if (this.state[r][c] > 0) {
        if (this.puzzle.multiColor) {
          ctx.fillStyle = fg.palette[this.state[r][c] - 1] || fg.palette[0];
        } else {
          ctx.fillStyle = gradientFill || fg.palette[0];
        }
        ctx.fillRect(x, y, cs, cs);
      } else if (this.marks[r][c]) {
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = Math.max(1.5, cs * 0.08);
        const p = cs * 0.25;
        ctx.beginPath();
        ctx.moveTo(x+p, y+p); ctx.lineTo(x+cs-p, y+cs-p);
        ctx.moveTo(x+cs-p, y+p); ctx.lineTo(x+p, y+cs-p);
        ctx.stroke();
      }
    }
  }

  drawGridLines() {
    const ctx = this.ctx, cs = this.cellSize;
    const x0 = this.marginLeft, y0 = this.marginTop;
    const x1 = x0 + this.M * cs, y1 = y0 + this.N * cs;
    ctx.strokeStyle = "rgba(148,163,184,0.15)"; ctx.lineWidth = 1;
    for (let c = 0; c <= this.M; c++) {
      ctx.beginPath(); ctx.moveTo(x0+c*cs, y0); ctx.lineTo(x0+c*cs, y1); ctx.stroke();
    }
    for (let r = 0; r <= this.N; r++) {
      ctx.beginPath(); ctx.moveTo(x0, y0+r*cs); ctx.lineTo(x1, y0+r*cs); ctx.stroke();
    }
    ctx.strokeStyle = "rgba(148,163,184,0.6)"; ctx.lineWidth = 2;
    for (let c = 0; c <= this.M; c += 5) {
      ctx.beginPath(); ctx.moveTo(x0+c*cs, y0); ctx.lineTo(x0+c*cs, y1); ctx.stroke();
    }
    for (let r = 0; r <= this.N; r += 5) {
      ctx.beginPath(); ctx.moveTo(x0, y0+r*cs); ctx.lineTo(x1, y0+r*cs); ctx.stroke();
    }
    ctx.strokeStyle = "rgba(203,213,225,0.8)"; ctx.lineWidth = 2;
    ctx.strokeRect(x0, y0, this.M*cs, this.N*cs);
  }

  drawClues() {
    const ctx = this.ctx, cs = this.cellSize, fg = this.puzzle.fg.palette;
    ctx.font = `${Math.max(10, Math.floor(cs * 0.42))}px system-ui, sans-serif`;
    ctx.textBaseline = "middle"; ctx.textAlign = "center";

    for (let r = 0; r < this.N; r++) {
      const clues = this.rows[r].clues;
      const matched = this.matchClues(this.state[r], clues);
      const { y } = this.cellToPixel(r, 0);
      for (let i = clues.length - 1, k = 0; i >= 0; i--, k++) {
        const clue = clues[i];
        const cx = this.marginLeft - (k + 0.5) * cs * 0.7 - 4;
        ctx.fillStyle = matched[i] ? "#475569" : (fg[clue.color - 1] || "#e2e8f0");
        ctx.fillText(String(clue.value), cx, y + cs/2);
      }
    }

    for (let c = 0; c < this.M; c++) {
      const clues = this.cols[c].clues;
      const colState = this.state.map(row => row[c]);
      const matched = this.matchClues(colState, clues);
      const { x } = this.cellToPixel(0, c);
      for (let i = clues.length - 1, k = 0; i >= 0; i--, k++) {
        const clue = clues[i];
        const cy = this.marginTop - (k + 0.5) * cs * 0.7 - 4;
        ctx.fillStyle = matched[i] ? "#475569" : (fg[clue.color - 1] || "#e2e8f0");
        ctx.fillText(String(clue.value), x + cs/2, cy);
      }
    }
  }

  extractRuns(cells) {
    const runs = []; let cur = null;
    for (const v of cells) {
      if (v > 0) {
        if (cur && cur.color === v) cur.len++;
        else { if (cur) runs.push(cur); cur = { color: v, len: 1 }; }
      } else { if (cur) { runs.push(cur); cur = null; } }
    }
    if (cur) runs.push(cur);
    return runs;
  }

  matchClues(cells, clues) {
    const runs = this.extractRuns(cells);
    const matched = new Array(clues.length).fill(false);
    let ri = 0;
    for (let ci = 0; ci < clues.length; ci++) {
      while (ri < runs.length) {
        if (runs[ri].color === clues[ci].color && runs[ri].len === clues[ci].value) {
          matched[ci] = true; ri++; break;
        }
        ri++;
      }
    }
    return matched;
  }

  lineSolved(cells, clues) {
    const runs = this.extractRuns(cells);
    if (runs.length !== clues.length) return false;
    return runs.every((r, i) => r.color === clues[i].color && r.len === clues[i].value);
  }

  checkWin() {
    for (let r = 0; r < this.N; r++) if (!this.lineSolved(this.state[r], this.rows[r].clues)) return false;
    for (let c = 0; c < this.M; c++) {
      const col = this.state.map(row => row[c]);
      if (!this.lineSolved(col, this.cols[c].clues)) return false;
    }
    return true;
  }

  async updateStatus() {
    if (this.won || this._checkingWin) return;
    if (!this.checkWin()) {
      if (!this.statusEl.classList.contains("error")) this.setStatus("");
      return;
    }
    this._checkingWin = true;
    try {
      if (this.puzzle.strict) {
        const actual = await this.gridHash();
        const expected = this.puzzle.options.hash;
        if (!this.checkWin()) return;
        if (expected === "sha256:" + actual || expected === actual) {
          this.won = true;
          this.setStatus("Solved ✓");
        } else {
          this.setStatus("All clues satisfied — but not the intended solution.");
        }
      } else {
        this.won = true;
        this.setStatus("Solved ✓");
      }
    } finally { this._checkingWin = false; }
  }

  async gridHash() {
    const str = this.state.map(row => row.map(v => v.toString(36)).join("")).join("\n");
    const buf = new TextEncoder().encode(str);
    const hashBuf = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(hashBuf))
      .map(b => b.toString(16).padStart(2, "0")).join("");
  }

  setupPointerEvents() {
    const canvas = this.canvas;
    const getCell = e => {
      const rect = canvas.getBoundingClientRect();
      return this.pixelToCell(e.clientX - rect.left, e.clientY - rect.top);
    };
    canvas.addEventListener("contextmenu", e => e.preventDefault());

    canvas.addEventListener("pointerdown", e => {
      if (this.won) return;
      this.painting = true;
      const cell = getCell(e);
      if (!cell) return;
      const { r, c } = cell;
      const isRight = e.button === 2;
      if (isRight || this.tool === "mark") {
        this.paintValue = { type: "mark", value: !this.marks[r][c] };
        this.marks[r][c] = this.paintValue.value;
        this.state[r][c] = 0;
      } else if (this.tool === "erase") {
        this.paintValue = { type: "state", value: 0 };
        this.state[r][c] = 0;
        this.marks[r][c] = false;
      } else {
        const v = this.state[r][c] === this.currentColor ? 0 : this.currentColor;
        this.paintValue = { type: "state", value: v };
        this.state[r][c] = v;
        if (v > 0) this.marks[r][c] = false;
      }
      this.render();
    });

    canvas.addEventListener("pointermove", e => {
      if (!this.painting || this.won || !this.paintValue) return;
      const cell = getCell(e);
      if (!cell) return;
      const { r, c } = cell;
      if (this.paintValue.type === "mark") {
        this.marks[r][c] = this.paintValue.value;
        this.state[r][c] = 0;
      } else {
        this.state[r][c] = this.paintValue.value;
        if (this.paintValue.value > 0) this.marks[r][c] = false;
      }
      this.render();
    });

    const stop = () => { this.painting = false; this.paintValue = null; };
    canvas.addEventListener("pointerup", stop);
    canvas.addEventListener("pointercancel", stop);
    canvas.addEventListener("pointerleave", stop);
  }
}

// =============== Load ===============
function loadPuzzle(text) {
  const wrap = document.getElementById("game-wrap");
  const statusEl = document.getElementById("status");
  const titleEl = document.getElementById("puzzle-title");

  let puzzle;
  try {
    puzzle = parseNonogram(text);
  } catch (e) {
    statusEl.classList.add("error");
    statusEl.textContent = "Error: " + e.message;
    return { error: e.message };
  }

  // Parse OK — now clear status and swap the board
  statusEl.classList.remove("error");
  statusEl.textContent = "";

  if (currentGame) { currentGame.destroy(); currentGame = null; }
  wrap.innerHTML = "";

  const canvas = document.createElement("canvas");
  canvas.id = "board";
  wrap.appendChild(canvas);

  try {
    currentGame = new NonogramGame(puzzle, canvas, titleEl, statusEl);
    currentGame.setupPointerEvents();
  } catch (e) {
    statusEl.classList.add("error");
    statusEl.textContent = "Error: " + e.message;
    return { error: e.message };
  }

  currentPuzzleText = text;
  document.getElementById("copy-puzzle").style.display = "";
  return { ok: true };
}

// =============== Copy (mobile-safe) ===============
async function copyToClipboard(text) {
  // Method 1: modern API
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      console.warn("clipboard.writeText failed:", e);
    }
  }

  // Method 2: execCommand + offscreen textarea
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0.01;width:1px;height:1px;";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, text.length);

  let ok = false;
  try {
    ok = document.execCommand("copy");
  } catch (e) {
    console.warn("execCommand copy failed:", e);
  }
  document.body.removeChild(ta);

  if (ok) return true;

  // Method 3: show visible textarea for manual copy
  showManualCopy(text);
  return false;
}

function showManualCopy(text) {
  const overlay = document.createElement("div");
  overlay.className = "copy-fallback";
  overlay.innerHTML = `
    <div class="box">
      <div class="hint">Auto-copy isn't available here. Select the text and copy it manually.</div>
      <textarea readonly></textarea>
      <button>Close</button>
    </div>
  `;
  document.body.appendChild(overlay);
  const ta = overlay.querySelector("textarea");
  const btn = overlay.querySelector("button");
  ta.value = text;
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, text.length);
  btn.onclick = () => document.body.removeChild(overlay);
}

// =============== Paste UI ===============
const pastePanel = document.getElementById("paste-panel");
const pasteInput = document.getElementById("paste-input");
const pasteError = document.getElementById("paste-error");

document.getElementById("toggle-paste").onclick = () => {
  pastePanel.classList.toggle("hidden");
  if (!pastePanel.classList.contains("hidden")) {
    pasteInput.value = currentPuzzleText.trim();
    pasteInput.focus();
    pasteError.textContent = "";
  }
};

document.getElementById("cancel-paste").onclick = () => {
  pastePanel.classList.add("hidden");
  pasteError.textContent = "";
};

document.getElementById("load-puzzle").onclick = () => {
  const result = loadPuzzle(pasteInput.value);
  if (result.ok) {
    pastePanel.classList.add("hidden");
    pasteError.textContent = "";
  } else {
    pasteError.textContent = result.error;
  }
};

document.getElementById("copy-puzzle").onclick = async () => {
  const btn = document.getElementById("copy-puzzle");
  const old = btn.textContent;
  const ok = await copyToClipboard(currentPuzzleText.trim());
  btn.textContent = ok ? "✓ Copied!" : "Copy manually";
  setTimeout(() => btn.textContent = old, 1500);
};

// =============== Boot ===============
loadPuzzle(DEFAULT_PUZZLE_TEXT);
</script>
</body>
</html>
