<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nonogram</title>
  <link rel="stylesheet" href="./style.css?v=9">
  <script>
    window.addEventListener("error", e => {
      const pre = document.createElement("pre");
      pre.style.cssText = "background:#7f1d1d;color:#fff;padding:0.6rem;font-size:0.75rem;white-space:pre-wrap;margin:0;position:relative;z-index:9999;";
      pre.textContent = "SCRIPT ERROR:\n" + (e.message || "unknown") +
        "\n" + (e.filename || "") + ":" + (e.lineno || "?");
      document.body.insertBefore(pre, document.body.firstChild);
    });
  </script>
</head>
<body>

<a href="../" class="back-link">← hub</a>

<header id="header">
  <div class="creator" id="creator"></div>
  <div class="title" id="title">Nonogram</div>
</header>

<section id="options" class="hidden">
  <nav class="tabs">
    <button data-tab="mode">Mode</button>
    <button data-tab="make">Make</button>
    <button data-tab="settings" class="active">Settings</button>
  </nav>

  <div class="tab-content hidden" id="tab-mode">
    <h3>Fun Mode</h3>
    <p style="font-size:0.9rem;color:var(--dim)">You are playing in Fun Mode.</p>
    <h3>Coming soon</h3>
    <p style="font-size:0.9rem;color:var(--dim)">Journey Mode · Puzzle Mode</p>
  </div>

  <div class="tab-content hidden" id="tab-make">
    <h3>Make your own</h3>
    <p style="font-size:0.9rem;color:var(--dim)">Visual puzzle creator — coming soon.</p>
  </div>

  <div class="tab-content" id="tab-settings">
    <h3>Behavior</h3>
    <div class="setting">
      <label for="set-autoMark">Auto-mark completed lines</label>
      <input type="checkbox" id="set-autoMark">
    </div>
    <div class="setting">
      <label for="set-autoGray">Auto-gray clues</label>
      <input type="checkbox" id="set-autoGray">
    </div>
    <div class="setting">
      <label for="set-surroundedOnly">Only gray when surrounded</label>
      <input type="checkbox" id="set-surroundedOnly">
    </div>
    <div class="setting">
      <label for="set-marksBlockFill">Marks block fills</label>
      <input type="checkbox" id="set-marksBlockFill">
    </div>

    <h3>Visual</h3>
    <div class="setting">
      <label for="set-tileBorders">Tile borders</label>
      <input type="checkbox" id="set-tileBorders">
    </div>
    <div class="setting">
      <label for="set-gridLineEvery">Grid line every N (0 = off)</label>
      <input type="number" id="set-gridLineEvery" min="0" max="20">
    </div>
    <div class="setting">
      <label for="set-markSymbol">Mark symbol</label>
      <select id="set-markSymbol"></select>
    </div>
    <div class="setting">
      <label for="set-pageBgColor">Page background</label>
      <input type="color" id="set-pageBgColor">
    </div>

    <h3>Drag</h3>
    <div class="setting">
      <label for="set-dragCounterThreshold">Show counter after N cells (0 = off)</label>
      <input type="number" id="set-dragCounterThreshold" min="0" max="50">
    </div>

    <h3>Gamepad</h3>
    <div class="setting">
      <label for="set-gamepadScale">Scale</label>
      <input type="range" id="set-gamepadScale" min="0.6" max="1.6" step="0.1">
    </div>
    <div class="setting">
      <label for="set-gamepadPosition">Position</label>
      <select id="set-gamepadPosition">
        <option value="bottom-left">Bottom left</option>
        <option value="bottom-right">Bottom right</option>
        <option value="top-left">Top left</option>
        <option value="top-right">Top right</option>
      </select>
    </div>
    <div class="setting">
      <label for="set-gamepadColor">Gamepad color</label>
      <input type="color" id="set-gamepadColor">
    </div>
    <div class="setting">
      <label for="set-cursorWrap">Cursor wraps at edges</label>
      <input type="checkbox" id="set-cursorWrap">
    </div>
    <div class="setting">
      <label for="set-cursorColorAuto">Cursor color auto-invert</label>
      <input type="checkbox" id="set-cursorColorAuto">
    </div>
    <div class="setting" id="cursorColorFixedRow" style="display:none">
      <label for="set-cursorColorValue">Cursor color</label>
      <input type="color" id="set-cursorColorValue">
    </div>

    <div id="tab-settings-info"></div>
  </div>
</section>

<main id="game-wrap"></main>

<button id="tool-btn" aria-label="tool">
  <span id="tool-symbol"></span>
</button>

<div id="gamepad" class="hidden pos-bl">
  <div id="gamepad-inner">
    <div class="dpad">
      <button class="dpad-btn up"    data-dir="up"    aria-label="up">▲</button>
      <button class="dpad-btn left"  data-dir="left"  aria-label="left">◀</button>
      <button class="dpad-btn right" data-dir="right" aria-label="right">▶</button>
      <button class="dpad-btn down"  data-dir="down"  aria-label="down">▼</button>
    </div>
    <div class="actions">
      <button class="act-btn" data-action="mark" id="gp-mark"></button>
      <button class="act-btn" data-action="fill" id="gp-fill"></button>
    </div>
  </div>
</div>

<div id="ghost" class="hidden">×</div>
<div id="status" class="hidden"></div>

<script src="./format.js?v=9"></script>
<script src="./game.js?v=9"></script>
<script src="./app.js?v=9"></script>
</body>
</html>
