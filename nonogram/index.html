<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nonogram · Fun Mode</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 0.75rem; }
  .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .toolbar button {
    background: #1e293b; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 8px;
    padding: 0.4rem 0.8rem; font-size: 0.85rem; cursor: pointer;
  }
  .toolbar button.active {
    background: #38bdf8; color: #0f172a;
    border-color: #38bdf8; font-weight: 600;
  }
  .board {
    display: grid;
    background: #1e293b;
    border: 2px solid #64748b;
    border-radius: 8px;
    padding: 4px;
  }
  .col-clue {
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    padding-bottom: 4px; font-size: 0.75rem;
    color: #94a3b8; line-height: 1.1;
  }
  .row-clue {
    display: flex; flex-direction: row;
    justify-content: flex-end; align-items: center;
    gap: 4px; padding-right: 4px;
    font-size: 0.75rem; color: #94a3b8;
  }
  .cell {
    background: #0f172a;
    border: 1px solid #334155;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #64748b;
  }
  .cell:hover { background: #16233b; }
  .cell.filled { background: #38bdf8; border-color: #0ea5e9; }
  .cell.marked::after { content: "×"; font-size: 1rem; line-height: 1; }
  .cell.thick-right { border-right: 2px solid #64748b; }
  .cell.thick-bottom { border-bottom: 2px solid #64748b; }
  #status { margin-top: 1rem; min-height: 1.5rem; font-size: 0.9rem; color: #4ade80; }
</style>
</head>
<body>

<h1>Nonogram · Fun Mode</h1>

<div class="toolbar">
  <button id="tool-fill" class="active">Fill</button>
  <button id="tool-mark">Mark ×</button>
  <button id="reset">Reset</button>
</div>

<div id="board" class="board"></div>
<div id="status"></div>

<script>
  // ---------- puzzle ----------
  const SOLUTION = [
    "....##....",
    "...####...",
    "..######..",
    ".########.",
    "##########",
    "##########",
    ".########.",
    "..######..",
    "...####...",
    "....##....",
  ];
  const N = SOLUTION.length;
  const M = SOLUTION[0].length;

  function cluesForLines(lines) {
    return lines.map(line => {
      const runs = line.match(/#+/g) || [];
      return runs.length ? runs.map(r => r.length) : [0];
    });
  }

  const colLines = [];
  for (let c = 0; c < M; c++) {
    let s = "";
    for (let r = 0; r < N; r++) s += SOLUTION[r][c];
    colLines.push(s);
  }
  const rowClues = cluesForLines(SOLUTION);
  const colClues = cluesForLines(colLines);

  // 0 = empty, 1 = filled, 2 = marked ×
  const state = Array.from({ length: N }, () => Array(M).fill(0));
  let won = false;

  // ---------- build board ----------
  const boardEl = document.getElementById("board");
  boardEl.style.gridTemplateColumns = `auto repeat(${M}, 2rem)`;
  boardEl.style.gridTemplateRows = `auto repeat(${N}, 2rem)`;

  const cellEls = [];

  boardEl.appendChild(document.createElement("div")); // corner

  for (let c = 0; c < M; c++) {
    const d = document.createElement("div");
    d.className = "col-clue";
    colClues[c].forEach(n => {
      const s = document.createElement("span");
      s.textContent = n;
      d.appendChild(s);
    });
    boardEl.appendChild(d);
  }

  for (let r = 0; r < N; r++) {
    const clue = document.createElement("div");
    clue.className = "row-clue";
    rowClues[r].forEach(n => {
      const s = document.createElement("span");
      s.textContent = n;
      clue.appendChild(s);
    });
    boardEl.appendChild(clue);

    const rowEls = [];
    for (let c = 0; c < M; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.r = r;
      cell.dataset.c = c;
      if (c === M - 1 || (c + 1) % 5 === 0) cell.classList.add("thick-right");
      if (r === N - 1 || (r + 1) % 5 === 0) cell.classList.add("thick-bottom");
      boardEl.appendChild(cell);
      rowEls.push(cell);
    }
    cellEls.push(rowEls);
  }

  // ---------- logic ----------
  function setCell(r, c, val) {
    if (state[r][c] === val) return;
    state[r][c] = val;
    cellEls[r][c].classList.toggle("filled", val === 1);
    cellEls[r][c].classList.toggle("marked", val === 2);
    checkWin();
  }

  function checkWin() {
    if (won) return;
    for (let r = 0; r < N; r++)
      for (let c = 0; c < M; c++)
        if ((state[r][c] === 1) !== (SOLUTION[r][c] === "#")) return;
    won = true;
    document.getElementById("status").textContent = "Solved ✨";
  }

  // ---------- interaction ----------
  let tool = "fill";
  let painting = false;
  let paintValue = 0;

  const toolFill = document.getElementById("tool-fill");
  const toolMark = document.getElementById("tool-mark");
  toolFill.onclick = () => { tool = "fill"; toolFill.classList.add("active"); toolMark.classList.remove("active"); };
  toolMark.onclick = () => { tool = "mark"; toolMark.classList.add("active"); toolFill.classList.remove("active"); };

  document.getElementById("reset").onclick = () => {
    for (let r = 0; r < N; r++) for (let c = 0; c < M; c++) setCell(r, c, 0);
    won = false;
    document.getElementById("status").textContent = "";
  };

  boardEl.addEventListener("contextmenu", e => e.preventDefault());

  boardEl.addEventListener("pointerdown", e => {
    if (won) return;
    const cell = e.target.closest(".cell");
    if (!cell) return;
    e.preventDefault();
    const r = +cell.dataset.r, c = +cell.dataset.c;
    const target = (e.button === 2 || tool === "mark") ? 2 : 1;
    paintValue = state[r][c] === target ? 0 : target;
    painting = true;
    setCell(r, c, paintValue);
  });

  boardEl.addEventListener("pointermove", e => {
    if (!painting || won) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const cell = el && el.closest ? el.closest(".cell") : null;
    if (!cell) return;
    setCell(+cell.dataset.r, +cell.dataset.c, paintValue);
  });

  window.addEventListener("pointerup", () => { painting = false; });
  window.addEventListener("pointercancel", () => { painting = false; });
</script>
</body>
</html>
