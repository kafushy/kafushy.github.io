<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kafushy</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #334155;
      --border: #334155;
      --text: #e2e8f0;
      --dim: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    body {
      display: flex; flex-direction: column; align-items: center;
      padding: 3rem 1rem 2rem;
    }
    header { text-align: center; margin-bottom: 2.5rem; }
    h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    .tagline { color: var(--dim); font-size: 0.9rem; margin-top: 0.4rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.9rem;
      width: 100%;
      max-width: 720px;
    }
    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 1.1rem; }
    }

    .card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem 1rem;
      text-decoration: none;
      color: var(--text);
      text-align: center;
      transition: background 0.15s, transform 0.15s, border-color 0.15s;
    }
    .card:hover, .card:focus-visible {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      outline: none;
    }
    .card .emoji { font-size: 1.8rem; display: block; margin-bottom: 0.4rem; }
    .card .name { font-size: 1rem; font-weight: 600; display: block; }
    .card .desc { font-size: 0.75rem; color: var(--dim); margin-top: 0.2rem; display: block; }
    .card.soon { opacity: 0.65; }
    .card.soon .desc { color: #64748b; }

    footer { margin-top: 3rem; color: var(--dim); font-size: 0.75rem; }
  </style>
</head>
<body>
  <header>
    <h1>kafushy</h1>
    <div class="tagline">a small corner of the internet</div>
  </header>

  <main class="grid">
    <a class="card" href="./nonogram/">
      <span class="emoji">🧩</span>
      <span class="name">Nonogram</span>
      <span class="desc">logic puzzles</span>
    </a>
    <a class="card soon" href="./pbbg/">
      <span class="emoji">🌱</span>
      <span class="name">PBBG</span>
      <span class="desc">coming soon</span>
    </a>
    <a class="card soon" href="./comic/">
      <span class="emoji">💬</span>
      <span class="name">Comic</span>
      <span class="desc">coming soon</span>
    </a>
    <a class="card soon" href="./music/">
      <span class="emoji">🎵</span>
      <span class="name">Music</span>
      <span class="desc">coming soon</span>
    </a>
    <a class="card soon" href="./blog/">
      <span class="emoji">📓</span>
      <span class="name">Blog</span>
      <span class="desc">coming soon</span>
    </a>
  </main>

  <footer>made by kafushy</footer>
</body>
</html>
